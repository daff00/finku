[project]
name = "finku-backend"
version = "0.1.0"
description = "Finku personal finance tracker — backend"
readme = "README.md"
authors = [
    { name = "daff00", email = "daffakpc21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.141.1",
    "pandas>=3.0.5",
    "passlib[bcrypt]>=1.7.4",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
